# This workflow automates the creation of a release pull request for the SDK.
#
# 📋 Steps:
# 1. Checks out the repository with full history and tags.
# 2. Fetches all Git tags to determine the latest released version.
# 3. Determines the previous version tag (semver-based).
# 4. Collects merged pull requests since the previous tag using GitHub CLI.
# 5. Filters PRs based on their merge commits being included since the last tag.
# 6. Formats the filtered PRs into a changelog.
# 7. Reads a custom pull request template (if available) for consistent release messaging.
# 8. Updates the SDK version using a script.
# 9. Cleans up temporary files used during changelog generation.
# 10. Automatically creates a release pull request targeting the `main` branch,
#     including the changelog and custom template in the PR body.
name: release-01-create-pull-request

on:
  workflow_dispatch:
    inputs:
      version:
        description: '📦 SDK Version'
        required: true
        default: '0.0.0'

jobs:
  create_release_pr:
    runs-on: macos-latest

    steps:
    - name: 📥 Checkout repository with full history and tags
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: 🔄 Fetch tags
      run: git fetch --tags

    - name: 🔖 Get latest tag before new version
      id: get-previous-tag
      run: |
        PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^([0-9]+\.){2}[0-9]+$' | head -n 1)
        echo "Previous tag: $PREVIOUS_TAG"
        echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

    - name: 📋 Generate changelog from merged PRs
      id: pr_list
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git log --pretty=format:"%H" ${{ steps.get-previous-tag.outputs.previous_tag }}..HEAD > commits.txt
        gh pr list --state merged --base main --json title,number,mergeCommit \
          --jq ".[] | [.title, .number, .mergeCommit.oid] | @tsv" > pr_data.tsv

        # Truncate changelog.txt to ensure fresh start (avoid appending to stale data)
        > changelog.txt
        while IFS=$'\t' read -r title number commit; do
          if grep -q "$commit" commits.txt; then
            echo "- PR #$number: $title" >> changelog.txt
          fi
        done < pr_data.tsv

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat changelog.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 📝 Read custom release PR template
      id: pr_template
      shell: bash
      run: |
        TEMPLATE_FILE=".github/pr-templates/release.md"
        echo "DEBUG: Looking for template at $TEMPLATE_FILE"

        if [ -f "$TEMPLATE_FILE" ]; then
          echo "DEBUG: Template file found. Contents below:"
          cat "$TEMPLATE_FILE"

          {
            echo "template<<EOF"
            cat "$TEMPLATE_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        else
          echo "DEBUG: Template file not found. Using default fallback."
          echo "template=_" >> "$GITHUB_OUTPUT"
        fi

    - name: 🛠 Update SDK version
      shell: bash
      env:
        SDK_VERSION: ${{ github.event.inputs.version }}
      run: |
        sh scripts/setup_version.sh -v "$SDK_VERSION"

    - name: Select Xcode for SPM validation
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: '26.3.0'

    - name: Validate distributable Swift package
      run: bash scripts/validate_spm.sh

    - name: 🧹 Cleanup autogenerated files
      run: |
        rm -f commits.txt pr_data.tsv changelog.txt

    - name: 🚀 Create Pull Request
      uses: peter-evans/create-pull-request@v3.10.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "🚀 chore: release v${{ github.event.inputs.version }}"
        title: "📦 Release v${{ github.event.inputs.version }}"
        body: |
          📦 Auto-created Pull Request for SDK release **v${{ github.event.inputs.version }}**

          ### 📋 Changes since last release (**${{ steps.get-previous-tag.outputs.previous_tag }}**):
          ${{ steps.pr_list.outputs.changelog }}

          ---

          ${{ steps.pr_template.outputs.template }}
        branch: release/${{ github.event.inputs.version }}
        base: main
        delete-branch: true
        labels: auto-generated
