# This workflow automates the creation of a GitHub Release for the SDK.
#
# 📋 Steps:
# 1. Checks out the `main` branch.
# 2. Gets the latest semver tag (e.g. 2.3.4).
# 3. Gets all commits from that tag to HEAD.
# 4. Lists all PRs merged into `main` and checks which are in that commit range.
# 5. Generates a changelog with the PRs.
# 6. Creates a GitHub release using the changelog.

# Requires LINEAR_ACCESS_KEY: the iOS Linear release pipeline access key.
# Linear completion confirms the GitHub Release after SPM validation.
name: release-03-create-gh-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version'
        required: true
        default: '0.0.0'

permissions:
  contents: write

jobs:
  release_create_github_release:
    runs-on: macos-latest

    steps:
    - name: 🔄 Checkout main branch
      uses: actions/checkout@v5
      with:
        ref: main
        fetch-depth: 0  # needed to access tags and full history

    - name: Verify release version and unused tag
      env:
        SDK_VERSION: ${{ github.event.inputs.version }}
      run: |
        set -euo pipefail
        [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected X.Y.Z"; exit 1; }
        if git rev-parse --verify "refs/tags/$SDK_VERSION" >/dev/null 2>&1; then
          echo "Release tag already exists; refusing to publish an unvalidated tag."
          exit 1
        fi
        grep -Fq "internal static let SDK_VERSION = \"$SDK_VERSION\"" TelnyxRTC/Telnyx/Verto/Message.swift

    - name: 🔖 Get latest tag before new version
      id: get-previous-tag
      run: |
        PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^([0-9]+\.){2}[0-9]+$' | head -n 1)
        echo "Previous tag: $PREVIOUS_TAG"
        echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

    - name: 📋 Generate changelog from merged PRs
      id: pr_list
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git log --pretty=format:"%H" ${{ steps.get-previous-tag.outputs.previous_tag }}..HEAD > commits.txt
        gh pr list --state merged --base main --json title,number,mergeCommit \
          --jq ".[] | [.title, .number, .mergeCommit.oid] | @tsv" > pr_data.tsv

        # Create changelog.txt from scratch (overwrite if exists)
        > changelog.txt
        while IFS=$'\t' read -r title number commit; do
          if grep -q "$commit" commits.txt; then
            echo "- PR #$number: $title" >> changelog.txt
          fi
        done < pr_data.tsv

        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat changelog.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 📄 Print changelog
      run: cat changelog.txt

    - name: Select Xcode for SPM validation
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
      with:
        xcode-version: '26.3.0'

    - name: Validate distributable Swift package
      run: bash scripts/validate_spm.sh

    - name: Sync Linear release
      uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: sync
        version: ${{ github.event.inputs.version }}
        name: iOS Voice SDK ${{ github.event.inputs.version }}
        release_notes: changelog.txt
        base_ref: ${{ steps.get-previous-tag.outputs.previous_tag }}
        links: |
          GitHub Release=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}
          Workflow Run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: 🚀 Create GitHub Release at the validated commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SDK_VERSION: ${{ github.event.inputs.version }}
      run: |
        gh release create "$SDK_VERSION" --target "$(git rev-parse HEAD)" \
          --title "Release $SDK_VERSION" --notes-file changelog.txt

    - name: Complete Linear release
      uses: linear/linear-release-action@v0
      with:
        access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
        command: complete
        version: ${{ github.event.inputs.version }}
